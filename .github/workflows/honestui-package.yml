name: Honest UI package

on:
  pull_request:
    paths:
      - ".github/workflows/honestui-package.yml"
      - "package/honestui/**"
      - "registry/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/honestui-package.yml"
      - "package/honestui/**"
      - "registry/**"

permissions:
  contents: read

concurrency:
  group: honestui-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.18.1, 24]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package/honestui/package-lock.json
          package-manager-cache: false
      - run: npm ci
        working-directory: package/honestui
      - run: npm run verify:release
        working-directory: package/honestui
