name: Publish Honest UI package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require the release tag to match package.json
        working-directory: package/honestui
        run: |
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"
      - name: Install a trusted-publishing compatible npm version
        run: npm install --global "npm@^11.5.1"
      - run: npm ci
        working-directory: package/honestui
      - run: npm run verify:release
        working-directory: package/honestui
      - run: npm publish --access public
        working-directory: package/honestui
