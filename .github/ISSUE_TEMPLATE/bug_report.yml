name: Bug report
description: Report reproducible behavior that is not working as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Search existing issues first, and do not disclose security vulnerabilities here.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
      placeholder: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal repository, sandbox, or exact steps that reproduce the problem.
      placeholder: |
        1. Install...
        2. Render...
        3. Observe...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Honest UI version
      placeholder: e.g. 0.0.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your browser, operating system, Node.js version, and package manager when relevant.
      placeholder: Chrome 140, macOS 15, Node.js 20.18.1, npm 11
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, logs, or anything else that may help. Remove secrets and personal information.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This report does not contain a security vulnerability.
          required: true
